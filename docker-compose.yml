version: '3.8'

services:
  lunet-mcp:
    build: .
    ports:
      - "8080:8080"
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PORT=8080
      - MCP_TRACE=${MCP_TRACE:-off}
    volumes:
      - .:/app

  lunet-test:
    build: .
    depends_on:
      - lunet-mcp
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
    volumes:
      - ./docker_test:/app/docker_test
      - .:/app
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "Waiting for server..."
        for i in 1 2 3 4 5; do
          if curl -s http://lunet-mcp:8080/ > /dev/null 2>&1; then
            echo "Server is ready!"
            break
          fi
          echo "Waiting... ($i/5)"
          sleep 1
        done

        echo ""
        echo "=== Running MCP Tests ==="
        echo ""

        echo "1. Server Info:"
        curl -s http://lunet-mcp:8080/
        echo ""

        echo ""
        echo "2. SSE Endpoint (3 sec):"
        timeout 3 curl -N http://lunet-mcp:8080/sse || true
        echo ""

        echo ""
        echo "=== Tests Complete ==="