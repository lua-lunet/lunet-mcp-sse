name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build'

permissions:
  contents: write
  packages: write

env:
  LUNET_VERSION: v0.9.2

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1 libluajit-5.1-2 libcurl4 zlib1g luajit

      - name: Fetch Lunet Runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: luajit scripts/lunet_fetch_release_v0.9.2.lua

      - name: Smoke Test
        run: |
          .lunet/${{ env.LUNET_VERSION }}/lunet-run app/main.lua &
          SERVER_PID=$!
          sleep 2
          curl -s --max-time 3 http://localhost:8080/ | head -c 200
          echo ""
          kill $SERVER_PID 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p dist
          cp -r .lunet/${{ env.LUNET_VERSION }}/* dist/
          cp -r app test dist/
          cp Makefile README.md run.sh dist/
          [ -f lunet-mcp-sse-scm-1.rockspec ] && cp lunet-mcp-sse-scm-1.rockspec dist/ || true
          tar -czvf lunet-mcp-sse-linux-amd64.tar.gz -C dist .

      - name: Upload amd64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunet-mcp-sse-linux-amd64
          path: lunet-mcp-sse-linux-amd64.tar.gz

  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1 libluajit-5.1-2 libcurl4 zlib1g luajit

      - name: Fetch Lunet Runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: luajit scripts/lunet_fetch_release_v0.9.2.lua

      - name: Smoke Test
        run: |
          .lunet/${{ env.LUNET_VERSION }}/lunet-run app/main.lua &
          SERVER_PID=$!
          sleep 2
          curl -s --max-time 3 http://localhost:8080/ | head -c 200
          echo ""
          kill $SERVER_PID 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p dist
          cp -r .lunet/${{ env.LUNET_VERSION }}/* dist/
          cp -r app test dist/
          cp Makefile README.md run.sh dist/
          [ -f lunet-mcp-sse-scm-1.rockspec ] && cp lunet-mcp-sse-scm-1.rockspec dist/ || true
          tar -czvf lunet-mcp-sse-linux-arm64.tar.gz -C dist .

      - name: Upload arm64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunet-mcp-sse-linux-arm64
          path: lunet-mcp-sse-linux-arm64.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: brew install pkg-config libuv luajit zlib curl

      - name: Fetch Lunet Runtime
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: luajit scripts/lunet_fetch_release_v0.9.2.lua

      - name: Smoke Test
        run: |
          .lunet/${{ env.LUNET_VERSION }}/lunet-run app/main.lua &
          SERVER_PID=$!
          sleep 2
          curl -s --max-time 3 http://localhost:8080/ | head -c 200
          echo ""
          kill $SERVER_PID 2>/dev/null || true

      - name: Package
        run: |
          mkdir -p dist
          cp -r .lunet/${{ env.LUNET_VERSION }}/* dist/
          cp -r app test dist/
          cp Makefile README.md run.sh dist/
          [ -f lunet-mcp-sse-scm-1.rockspec ] && cp lunet-mcp-sse-scm-1.rockspec dist/ || true
          tar -czvf lunet-mcp-sse-macos.tar.gz -C dist .

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunet-mcp-sse-macos
          path: lunet-mcp-sse-macos.tar.gz

  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and Extract Lunet Runtime
        shell: pwsh
        run: |
          curl.exe -fsSL -o lunet-windows-amd64.zip "https://github.com/lua-lunet/lunet/releases/download/${{ env.LUNET_VERSION }}/lunet-windows-amd64.zip"
          Expand-Archive -Path lunet-windows-amd64.zip -DestinationPath .lunet\${{ env.LUNET_VERSION }}

      - name: Smoke Test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath ".\.lunet\${{ env.LUNET_VERSION }}\lunet-run.exe" -ArgumentList "app\main.lua" -PassThru
          Start-Sleep -Seconds 2
          try {
            curl.exe -s --max-time 3 http://localhost:8080/
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse .lunet\${{ env.LUNET_VERSION }}\* -Destination dist\
          Copy-Item -Recurse app -Destination dist\app
          Copy-Item -Recurse test -Destination dist\test
          Copy-Item Makefile -Destination dist\
          Copy-Item README.md -Destination dist\
          Copy-Item run.sh -Destination dist\
          if (Test-Path lunet-mcp-sse-scm-1.rockspec) { Copy-Item lunet-mcp-sse-scm-1.rockspec -Destination dist\ }
          Push-Location dist
          7z a ../lunet-mcp-sse-windows-amd64.zip .
          Pop-Location

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunet-mcp-sse-windows-amd64
          path: lunet-mcp-sse-windows-amd64.zip

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64]
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 binaries
        uses: actions/download-artifact@v4
        with:
          name: lunet-mcp-sse-linux-amd64
          path: artifacts/amd64/

      - name: Download arm64 binaries
        uses: actions/download-artifact@v4
        with:
          name: lunet-mcp-sse-linux-arm64
          path: artifacts/arm64/

      - name: Prepare staging
        run: |
          for arch in amd64 arm64; do
            mkdir -p "staging/${arch}"
            tar -xzf "artifacts/${arch}/lunet-mcp-sse-linux-${arch}.tar.gz" -C "staging/${arch}"
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=raw,value=nightly,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image manifests
        run: |
          echo "Image digest:"
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:nightly 2>/dev/null || echo "Images built successfully"

  nightly:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64, build-macos, build-windows]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Delete existing nightly release
        uses: dev-drprasad/delete-tag-and-release@v1.1
        with:
          tag_name: nightly
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true

      - name: Create Nightly Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          body: |
            ## Nightly Build

            **Commit:** ${{ github.sha }}

            ### Binaries

            | Platform | Archive |
            |----------|---------|
            | Linux (amd64) | `lunet-mcp-sse-linux-amd64.tar.gz` |
            | Linux (arm64) | `lunet-mcp-sse-linux-arm64.tar.gz` |
            | macOS (arm64) | `lunet-mcp-sse-macos.tar.gz` |
            | Windows (amd64) | `lunet-mcp-sse-windows-amd64.zip` |
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip

  release:
    name: Tagged Release
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## Release ${{ steps.version.outputs.VERSION }}

            ### Binaries

            | Platform | Archive |
            |----------|---------|
            | Linux (amd64) | `lunet-mcp-sse-linux-amd64.tar.gz` |
            | Linux (arm64) | `lunet-mcp-sse-linux-arm64.tar.gz` |
            | macOS (arm64) | `lunet-mcp-sse-macos.tar.gz` |
            | Windows (amd64) | `lunet-mcp-sse-windows-amd64.zip` |
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
