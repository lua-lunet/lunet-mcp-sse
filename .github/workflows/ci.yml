name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build'

permissions:
  contents: write
  packages: write

env:
  LUNET_VERSION: main
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.upload-artifact.outputs.artifact-name }}

    steps:
    - uses: actions/checkout@v4

    - name: Checkout lunet
      uses: actions/checkout@v4
      with:
        repository: lua-lunet/lunet
        ref: ${{ env.LUNET_VERSION }}
        path: lunet

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libuv1-dev luajit libluajit-5.1-dev

    - name: Configure Lunet
      working-directory: lunet
      run: xmake f -m release -y

    - name: Build Lunet
      working-directory: lunet
      run: xmake build

    - name: Build Lunet SQLite3
      working-directory: lunet
      run: xmake build lunet-sqlite3

    - name: Setup Lunet Binary
      working-directory: lunet
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        ln -sf "$(basename $(dirname $LUNET_BIN))/$(basename $LUNET_BIN)" build/lunet
        ls -la build/

    - name: Test MCP Server
      run: |
        LUNET_BIN=$(find lunet/build -name 'lunet-run' -type f | head -1)
        timeout 5 $LUNET_BIN app/main.lua &
        SERVER_PID=$!
        sleep 2
        curl -s --max-time 3 http://localhost:8080/ | head -c 200
        echo ""
        kill $SERVER_PID 2>/dev/null || true

    - name: Package
      run: |
        mkdir -p dist/bin
        mkdir -p dist/lib
        mkdir -p dist/app
        mkdir -p dist/test

        cp lunet/build/lunet dist/bin/lunet
        cp lunet/build/lib/*.so dist/lib/ 2>/dev/null || true

        cp -r app/* dist/app/
        cp -r test/* dist/test/
        cp Makefile dist/
        cp README.md dist/
        cp lunet-mcp-sse-scm-1.rockspec dist/

        cat > dist/run.sh << 'EOF'
        #!/bin/bash
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
        export LUA_CPATH="$SCRIPT_DIR/lib/?.so;;"
        exec "$SCRIPT_DIR/bin/lunet" "$SCRIPT_DIR/app/main.lua" "$@"
        EOF
        chmod +x dist/run.sh

        tar -czvf lunet-mcp-sse-linux-amd64.tar.gz -C dist .
        echo "artifact-name=lunet-mcp-sse-linux-amd64.tar.gz" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunet-mcp-sse-linux-amd64
        path: lunet-mcp-sse-linux-amd64.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Checkout lunet
      uses: actions/checkout@v4
      with:
        repository: lua-lunet/lunet
        ref: ${{ env.LUNET_VERSION }}
        path: lunet

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Install Dependencies
      run: brew install pkg-config libuv luajit

    - name: Configure Lunet
      working-directory: lunet
      run: xmake f -m release -y

    - name: Build Lunet
      working-directory: lunet
      run: xmake build

    - name: Build Lunet SQLite3
      working-directory: lunet
      run: xmake build lunet-sqlite3

    - name: Setup Lunet Binary
      working-directory: lunet
      run: |
        LUNET_BIN=$(find build -name 'lunet-run' -type f | head -1)
        ln -sf "$(basename $(dirname $LUNET_BIN))/$(basename $LUNET_BIN)" build/lunet
        ls -la build/

    - name: Test MCP Server
      run: |
        LUNET_BIN=$(find lunet/build -name 'lunet-run' -type f | head -1)
        timeout 5 $LUNET_BIN app/main.lua &
        SERVER_PID=$!
        sleep 2
        curl -s --max-time 3 http://localhost:8080/ | head -c 200
        echo ""
        kill $SERVER_PID 2>/dev/null || true

    - name: Package
      run: |
        mkdir -p dist/bin
        mkdir -p dist/lib
        mkdir -p dist/app
        mkdir -p dist/test

        cp lunet/build/lunet dist/bin/lunet
        cp lunet/build/lib/*.so dist/lib/ 2>/dev/null || true

        cp -r app/* dist/app/
        cp -r test/* dist/test/
        cp Makefile dist/
        cp README.md dist/
        cp lunet-mcp-sse-scm-1.rockspec dist/

        cat > dist/run.sh << 'EOF'
        #!/bin/bash
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
        export LUA_CPATH="$SCRIPT_DIR/lib/?.so;;"
        exec "$SCRIPT_DIR/bin/lunet" "$SCRIPT_DIR/app/main.lua" "$@"
        EOF
        chmod +x dist/run.sh

        tar -czvf lunet-mcp-sse-macos.tar.gz -C dist .

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunet-mcp-sse-macos
        path: lunet-mcp-sse-macos.tar.gz

  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-linux

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Linux binaries
      uses: actions/download-artifact@v4
      with:
        name: lunet-mcp-sse-linux-amd64
        path: artifacts/

    - name: Extract Linux binaries
      run: |
        tar -xzf artifacts/lunet-mcp-sse-linux-amd64.tar.gz
        ls -la

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha
          type=ref,event=branch
          type=raw,value=nightly,enable=eq(${{ github.ref }}, 'refs/heads/main')

    - name: Build and push multi-arch Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Show image digest
      run: |
        echo "Image digest:"
        crane digest ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly || echo "Using buildx inspect"
        docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly

  nightly:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Delete existing nightly release
      uses: dev-drprasad/delete-tag-and-release@v1.1
      with:
        tag_name: nightly
        github_token: ${{ secrets.GITHUB_TOKEN }}
        delete_release: true
      continue-on-error: true

    - name: Create Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: Nightly Build
        prerelease: true
        body: |
          ## Nightly Build

          **Commit:** ${{ github.sha }}
          **Date:** ${{ github.event.head_commit.timestamp }}

          ### Docker

          ```bash
          docker run -p 8080:8080 -e TAVILY_API_KEY=your_key ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          ```

          ### Binaries

          | Platform | Archive |
          |----------|---------|
          | Linux (amd64) | `lunet-mcp-sse-linux-amd64.tar.gz` |
          | macOS (arm64) | `lunet-mcp-sse-macos.tar.gz` |

          ### Docker Hub Tags

          - `ghcr.io/lua-lunet/lunet-mcp-sse:nightly` - Latest from main
          - `ghcr.io/lua-lunet/lunet-mcp-sse:<sha>` - Specific commit
        files: |
          artifacts/*.tar.gz
          artifacts/*.zip

  release:
    name: Tagged Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, docker]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## Release ${{ steps.version.outputs.VERSION }}

          ### Docker

          ```bash
          docker run -p 8080:8080 -e TAVILY_API_KEY=your_key ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          ```

          ### Binaries

          | Platform | Archive |
          |----------|---------|
          | Linux (amd64) | `lunet-mcp-sse-linux-amd64.tar.gz` |
          | macOS (arm64) | `lunet-mcp-sse-macos.tar.gz` |
        files: |
          artifacts/*.tar.gz
          artifacts/*.zip