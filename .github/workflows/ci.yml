name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual build'

permissions:
  contents: write
  packages: write

env:
  LUNET_VERSION: main
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Checkout lunet
      uses: actions/checkout@v4
      with:
        repository: lua-lunet/lunet
        ref: ${{ env.LUNET_VERSION }}
        path: lunet

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libuv1-dev luajit libluajit-5.1-dev

    - name: Configure Lunet
      working-directory: lunet
      run: xmake f -m release -y

    - name: Build Lunet
      working-directory: lunet
      run: xmake build

    - name: Build Lunet SQLite3
      working-directory: lunet
      run: xmake build lunet-sqlite3

    - name: Package
      run: |
        mkdir -p dist/bin
        mkdir -p dist/lib
        mkdir -p dist/app
        mkdir -p dist/test

        cp lunet/build/lunet dist/bin/lunet
        cp lunet/build/lib/*.so dist/lib/ 2>/dev/null || true

        cp -r app/* dist/app/
        cp -r test/* dist/test/
        cp Makefile dist/
        cp README.md dist/
        cp lunet-mcp-sse-scm-1.rockspec dist/

        cat > dist/run.sh << 'EOF'
        #!/bin/bash
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
        export LUA_CPATH="$SCRIPT_DIR/lib/?.so;;"
        exec "$SCRIPT_DIR/bin/lunet" "$SCRIPT_DIR/app/main.lua" "$@"
        EOF
        chmod +x dist/run.sh

        tar -czvf lunet-mcp-sse-linux-amd64.tar.gz -C dist .

    - name: Upload amd64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunet-mcp-sse-linux-amd64
        path: lunet-mcp-sse-linux-amd64.tar.gz

  build-linux-arm64:
    name: Build Linux arm64
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Checkout lunet
      uses: actions/checkout@v4
      with:
        repository: lua-lunet/lunet
        ref: ${{ env.LUNET_VERSION }}
        path: lunet

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libuv1-dev luajit libluajit-5.1-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - name: Configure Lunet (arm64)
      working-directory: lunet
      run: xmake f -m release -y --cc=gcc-aarch64-linux-gnu --cxx=g++-aarch64-linux-gnu -a arm64

    - name: Build Lunet (arm64)
      working-directory: lunet
      run: xmake build

    - name: Package arm64
      run: |
        mkdir -p dist/bin
        mkdir -p dist/lib
        mkdir -p dist/app
        mkdir -p dist/test

        cp lunet/build/lunet dist/bin/lunet
        cp lunet/build/lib/*.so dist/lib/ 2>/dev/null || true

        cp -r app/* dist/app/
        cp -r test/* dist/test/
        cp Makefile dist/
        cp README.md dist/
        cp lunet-mcp-sse-scm-1.rockspec dist/

        cat > dist/run.sh << 'EOF'
        #!/bin/bash
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
        export LUA_CPATH="$SCRIPT_DIR/lib/?.so;;"
        exec "$SCRIPT_DIR/bin/lunet" "$SCRIPT_DIR/app/main.lua" "$@"
        EOF
        chmod +x dist/run.sh

        tar -czvf lunet-mcp-sse-linux-arm64.tar.gz -C dist .

    - name: Upload arm64 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunet-mcp-sse-linux-arm64
        path: lunet-mcp-sse-linux-arm64.tar.gz

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Checkout lunet
      uses: actions/checkout@v4
      with:
        repository: lua-lunet/lunet
        ref: ${{ env.LUNET_VERSION }}
        path: lunet

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Install Dependencies
      run: brew install pkg-config libuv luajit

    - name: Configure Lunet
      working-directory: lunet
      run: xmake f -m release -y

    - name: Build Lunet
      working-directory: lunet
      run: xmake build

    - name: Build Lunet SQLite3
      working-directory: lunet
      run: xmake build lunet-sqlite3

    - name: Package
      run: |
        mkdir -p dist/bin
        mkdir -p dist/lib
        mkdir -p dist/app
        mkdir -p dist/test

        cp lunet/build/lunet dist/bin/lunet
        cp lunet/build/lib/*.so dist/lib/ 2>/dev/null || true

        cp -r app/* dist/app/
        cp -r test/* dist/test/
        cp Makefile dist/
        cp README.md dist/
        cp lunet-mcp-sse-scm-1.rockspec dist/

        cat > dist/run.sh << 'EOF'
        #!/bin/bash
        SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
        export LUA_CPATH="$SCRIPT_DIR/lib/?.so;;"
        exec "$SCRIPT_DIR/bin/lunet" "$SCRIPT_DIR/app/main.lua" "$@"
        EOF
        chmod +x dist/run.sh

        tar -czvf lunet-mcp-sse-macos.tar.gz -C dist .

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunet-mcp-sse-macos
        path: lunet-mcp-sse-macos.tar.gz

  docker:
    name: Build Multi-arch Docker
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download amd64 binaries
      uses: actions/download-artifact@v4
      with:
        name: lunet-mcp-sse-linux-amd64
        path: artifacts/amd64/

    - name: Download arm64 binaries
      uses: actions/download-artifact@v4
      with:
        name: lunet-mcp-sse-linux-arm64
        path: artifacts/arm64/

    - name: Prepare multi-arch binaries
      run: |
        ls -la artifacts/
        mkdir -p bin lib
        # Copy amd64 binary
        cp artifacts/amd64/bin/lunet bin/lunet-amd64
        cp artifacts/amd64/lib/*.so lib/ 2>/dev/null || true
        # Copy arm64 binary
        cp artifacts/arm64/bin/lunet bin/lunet-arm64
        cp artifacts/arm64/lib/*.so lib/ 2>/dev/null || true

        ls -la bin/
        file bin/*

    - name: Create Dockerfile for multi-arch
      run: |
        cat > Dockerfile.multi << 'EOF'
        FROM debian:trixie-slim
        RUN apt-get update && apt-get install -y --no-install-recommends \
            curl ca-certificates && rm -rf /var/lib/apt/lists/*
        WORKDIR /app
        COPY bin/lunet-amd64 /usr/local/bin/lunet-amd64
        COPY bin/lunet-arm64 /usr/local/bin/lunet-arm64
        COPY lib/*.so /usr/local/lib/
        COPY app/ /app/app/
        COPY artifacts/amd64/run.sh /app/run.sh
        ENV LUA_CPATH=/usr/local/lib/?.so;;
        RUN chmod +x /app/run.sh
        EXPOSE 8080
        CMD ["/app/run.sh"]
        EOF

        # Create runtime script that picks the right binary
        cat > artifacts/amd64/run.sh << 'EOF'
        #!/bin/bash
        ARCH=$(uname -m)
        if [ "$ARCH" = "x86_64" ]; then
            LUNET=/usr/local/bin/lunet-amd64
        else
            LUNET=/usr/local/bin/lunet-arm64
        fi
        export LUA_CPATH=/usr/local/lib/?.so;;
        exec $LUNET /app/app/main.lua
        EOF
        chmod +x artifacts/amd64/run.sh

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=sha
          type=ref,event=branch
          type=raw,value=nightly,enable=eq(${{ github.ref }}, 'refs/heads/main')

    - name: Build and push multi-arch Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile.multi
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        platforms: linux/amd64,linux/arm64
        cache-from: type=gha
        cache-to: type=gha,mode=max

  nightly:
    name: Nightly Release
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64, build-macos, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Delete existing nightly release
      uses: dev-drprasad/delete-tag-and-release@v1.1
      with:
        tag_name: nightly
        github_token: ${{ secrets.GITHUB_TOKEN }}
        delete_release: true
      continue-on-error: true

    - name: Create Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: Nightly Build
        prerelease: true
        body: |
          ## Nightly Build

          **Commit:** ${{ github.sha }}

          ### Docker

          ```bash
          docker run -p 8080:8080 -e TAVILY_API_KEY=your_key ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:nightly
          ```

          ### Binaries

          | Platform | Archive |
          |----------|---------|
          | Linux (amd64) | `lunet-mcp-sse-linux-amd64.tar.gz` |
          | Linux (arm64) | `lunet-mcp-sse-linux-arm64.tar.gz` |
          | macOS (arm64) | `lunet-mcp-sse-macos.tar.gz` |
        files: |
          artifacts/*.tar.gz
          artifacts/*.zip

  release:
    name: Tagged Release
    runs-on: ubuntu-latest
    needs: [build-linux-amd64, build-linux-arm64, build-macos, docker]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - uses: actions/checkout@v4

    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Get version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## Release ${{ steps.version.outputs.VERSION }}

          ### Docker

          ```bash
          docker run -p 8080:8080 -e TAVILY_API_KEY=your_key ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          ```

          ### Binaries

          | Platform | Archive |
          |----------|---------|
          | Linux (amd64) | `lunet-mcp-sse-linux-amd64.tar.gz` |
          | Linux (arm64) | `lunet-mcp-sse-linux-arm64.tar.gz` |
          | macOS (arm64) | `lunet-mcp-sse-macos.tar.gz` |
        files: |
          artifacts/*.tar.gz
          artifacts/*.zip